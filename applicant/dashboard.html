<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Dashboard | WTOIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">WTOIS Applicant Portal</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-white" id="userNameDisplay">Welcome</span>
                <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12 text-end">
                <a href="new-application.html" class="btn btn-success">+ New MTOP Application</a>
                <a href="renewal.html" class="btn btn-primary">MTOP Renewal</a>
                <a href="dropping.html" class="btn btn-warning">Drop MTOP</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">My Applications</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Ref Number</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Date Submitted</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTableBody">
                            <tr><td colspan="5" class="text-center">Loading applications...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuthAndRoute();
            if(!auth) return;
            currentUser = auth.session.user;
            
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                document.getElementById('userNameDisplay').textContent = `Welcome, ${profile.first_name} ${profile.last_name}`;
            }

            loadApplications();
        });

        async function loadApplications() {
            const tbody = document.getElementById('applicationsTableBody');
            
            const { data, error } = await supabase
                .from('applications')
                .select('id, application_number, transaction_type, current_status, submitted_at, created_at')
                .eq('applicant_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">Error loading data: ${error.message}</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No applications found. Start a new one above.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(app => `
                <tr>
                    <td class="fw-bold">${app.application_number}</td>
                    <td>${app.transaction_type}</td>
                    <td>${getStatusBadge(app.current_status)}</td>
                    <td>${formatDate(app.submitted_at || app.created_at)}</td>
                    <td>
                        <a href="application-details.html?id=${app.id}" class="btn btn-sm btn-outline-primary">View / Track</a>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
