<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Details | WTOIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0">Application Summary</h5>
                        <div id="statusBadgeContainer"></div>
                    </div>
                    <div class="card-body" id="appDetailsContainer">
                        <p class="text-center">Loading details...</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h6 class="mb-0">Submitted Documents</h6>
                    </div>
                    <ul class="list-group list-group-flush" id="documentsList">
                        <li class="list-group-item text-center text-muted">Loading documents...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentUser = null;
        let currentAppId = new URLSearchParams(window.location.search).get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuthAndRoute();
            if(!auth) return;
            currentUser = auth.session.user;
            
            if (!currentAppId) {
                document.getElementById('appDetailsContainer').innerHTML = '<div class="alert alert-danger">No application ID provided.</div>';
                return;
            }

            loadApplicationDetails();
            loadDocuments();
        });

        async function loadApplicationDetails() {
            const { data, error } = await supabase
                .from('applications')
                .select(`
                    *,
                    vehicles ( plate_number, make, model, engine_number, chassis_number )
                `)
                .eq('id', currentAppId)
                .single();

            if (error || !data) {
                document.getElementById('appDetailsContainer').innerHTML = '<div class="alert alert-danger">Application not found.</div>';
                return;
            }

            document.getElementById('statusBadgeContainer').innerHTML = getStatusBadge(data.current_status);
            
            document.getElementById('appDetailsContainer').innerHTML = `
                <div class="row mb-3">
                    <div class="col-sm-4 text-muted">Reference Number</div>
                    <div class="col-sm-8 fw-bold">${data.application_number}</div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-4 text-muted">Transaction Type</div>
                    <div class="col-sm-8">${data.transaction_type}</div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-4 text-muted">Date Submitted</div>
                    <div class="col-sm-8">${formatDate(data.submitted_at || data.created_at)}</div>
                </div>
                <hr>
                <h6>Vehicle Information</h6>
                <div class="row mb-2">
                    <div class="col-sm-4 text-muted">Plate Number</div>
                    <div class="col-sm-8">${data.vehicles.plate_number}</div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-4 text-muted">Make / Model</div>
                    <div class="col-sm-8">${data.vehicles.make} ${data.vehicles.model || ''}</div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-4 text-muted">Engine / Chassis</div>
                    <div class="col-sm-8">${data.vehicles.engine_number} / ${data.vehicles.chassis_number}</div>
                </div>
            `;
        }

        async function loadDocuments() {
            const { data, error } = await supabase
                .from('application_documents')
                .select('*')
                .eq('application_id', currentAppId);

            const docList = document.getElementById('documentsList');
            
            if (error || data.length === 0) {
                docList.innerHTML = '<li class="list-group-item text-muted">No documents found.</li>';
                return;
            }

            docList.innerHTML = data.map(doc => {
                let badgeColor = doc.verification_status === 'VERIFIED' ? 'success' 
                               : doc.verification_status === 'REJECTED' ? 'danger' 
                               : 'warning';
                return `
                <li class="list-group-item d-flex justify-content-between align-items-start py-3">
                    <div class="ms-2 me-auto overflow-hidden pe-3">
                        <div class="fw-bold">${doc.document_type}</div>
                        <div class="text-muted small text-break">${doc.original_file_name}</div>
                        ${doc.rejection_reason ? `<div class="text-danger small mt-1">Reason: ${doc.rejection_reason}</div>` : ''}
                    </div>
                    <span class="badge bg-${badgeColor} rounded-pill flex-shrink-0">${doc.verification_status}</span>
                </li>
                `;
            }).join('');
        }
    </script>
</body>
</html>
