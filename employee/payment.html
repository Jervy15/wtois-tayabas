<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing | WTOIS CTO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="dashboard.html">← Back to Queue</a>
            <span class="navbar-text text-white">CTO Payment Module</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 text-info">Application Details</h5>
                    </div>
                    <div class="card-body" id="appDetailsContainer">
                        <p class="text-center">Loading details...</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card shadow-sm border-info">
                    <div class="card-header bg-info text-dark py-3">
                        <h5 class="mb-0">Record Payment</h5>
                    </div>
                    <div class="card-body">
                        <form id="paymentForm">
                            <div class="alert alert-secondary small">
                                Collect the exact fee at the cashier window, generate the Official Receipt, and input the details below.
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Official Receipt (O.R.) Number <span class="text-danger">*</span></label>
                                <input type="text" id="orNumber" class="form-control" required placeholder="e.g., OR-987654321">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Amount Paid (PHP) <span class="text-danger">*</span></label>
                                <input type="number" id="amountPaid" class="form-control" required placeholder="0.00" step="0.01">
                            </div>
                            
                            <button type="submit" id="btnSubmitPayment" class="btn btn-info w-100 fw-bold">
                                Confirm Payment & Forward to Mayor's Office
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentAppId = new URLSearchParams(window.location.search).get('id');
        let currentRemarks = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuthAndRoute();
            if(!auth) return;
            
            if (!currentAppId) {
                document.getElementById('appDetailsContainer').innerHTML = '<div class="alert alert-danger">No application ID provided.</div>';
                return;
            }
            loadPaymentDetails();
        });

        async function loadPaymentDetails() {
            // 1. Get Application & Vehicle (without trying to join profiles)
            const { data: appData, error: appError } = await supabase
                .from('applications')
                .select(`
                    application_number, current_status, transaction_type, remarks, applicant_id,
                    vehicles ( plate_number, make, model )
                `)
                .eq('id', currentAppId)
                .single();

            if (appError) {
                document.getElementById('appDetailsContainer').innerHTML = `<div class="alert alert-danger">App Error: ${appError.message}</div>`;
                return;
            }

            // 2. Safely get the Profile separately
            const { data: profileData } = await supabase
                .from('profiles')
                .select('first_name, last_name')
                .eq('id', appData.applicant_id)
                .single();

            if (appData.current_status !== 'FOR_PAYMENT') {
                document.getElementById('appDetailsContainer').innerHTML = `<div class="alert alert-warning">This application is currently in stage: ${appData.current_status}. It is not ready for payment.</div>`;
                document.getElementById('paymentForm').style.display = 'none';
                return;
            }

            currentRemarks = appData.remarks || "";
            const firstName = profileData ? profileData.first_name : 'Unknown';
            const lastName = profileData ? profileData.last_name : '';

            document.getElementById('appDetailsContainer').innerHTML = `
                <div class="row mb-2"><div class="col-sm-4 text-muted">Applicant</div><div class="col-sm-8 fw-bold">${firstName} ${lastName}</div></div>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Application Ref</div><div class="col-sm-8 fw-bold">${appData.application_number}</div></div>
                <div class="row mb-3"><div class="col-sm-4 text-muted">Transaction</div><div class="col-sm-8"><span class="badge bg-secondary">${appData.transaction_type}</span></div></div>
                <hr>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Plate Number</div><div class="col-sm-8 fw-bold fs-5 text-primary">${appData.vehicles?.plate_number || 'N/A'}</div></div>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Vehicle</div><div class="col-sm-8">${appData.vehicles?.make || ''} ${appData.vehicles?.model || ''}</div></div>
            `;
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orNumber = document.getElementById('orNumber').value;
            const amount = document.getElementById('amountPaid').value;
            
            if(!confirm(`Confirm payment of PHP ${amount} with OR# ${orNumber}?`)) return;

            // Append payment details to existing remarks so we don't lose inspection notes
            const updatedRemarks = `${currentRemarks} | Payment OR#: ${orNumber} (PHP ${amount})`;

            const { error } = await supabase.from('applications')
                .update({ 
                    current_status: 'FOR_APPROVAL',
                    remarks: updatedRemarks
                })
                .eq('id', currentAppId);

            if (error) {
                alert("Database Error: " + error.message);
            } else {
                alert("Payment recorded successfully! Forwarded to Mayor's Office.");
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
