<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WTOIS Tayabas City</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4">WTOIS Login</h4>
                        <div id="alertBox" class="alert d-none"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnLogin">Log In</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="register.html" class="text-decoration-none">Create an Applicant Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', checkAuthAndRoute);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoader('btnLogin', 'Authenticating...');
            const alertBox = document.getElementById('alertBox');
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            });

            if (error) {
                hideLoader('btnLogin');
                alertBox.className = 'alert alert-danger d-block';
                alertBox.textContent = error.message;
            } else {
                await checkAuthAndRoute();
            }
        });
    </script>
</body>
</html>
