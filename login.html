<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WTOIS Tayabas City</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
        .password-toggle { cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-card border">
        <h3 class="text-center mb-4" id="formTitle">WTOIS Login</h3>
        <div id="loginError" class="alert alert-danger" style="display: none;"></div>
        <div id="loginSuccess" class="alert alert-success" style="display: none;"></div>
        
        <!-- Standard Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" required>
                    <span class="input-group-text password-toggle" id="togglePassword">
                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                    </span>
                </div>
                <div class="text-end mt-1">
                    <a href="#" id="forgotPassword" class="text-decoration-none small text-secondary">Forgot Password?</a>
                </div>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 mb-3 fw-bold">Log In</button>
            <div class="text-center">
                <a href="register.html" class="text-decoration-none">Create an Applicant Account</a>
            </div>
        </form>

        <!-- Update Password Form (Hidden by default) -->
        <form id="updatePasswordForm" style="display: none;">
            <div class="alert alert-info small">Enter your new password below.</div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" required minlength="6">
            </div>
            <button type="submit" id="btnUpdatePassword" class="btn btn-success w-100 fw-bold">Save New Password</button>
        </form>
    </div>

    <script src="assets/js/supabase.js"></script>
    
    <script>
        // --- 1. Detect Password Recovery Mode ---
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('updatePasswordForm').style.display = 'block';
                document.getElementById('formTitle').innerText = 'Set New Password';
                document.getElementById('loginError').style.display = 'none';
                document.getElementById('loginSuccess').style.display = 'none';
            }
        });

        // --- 2. Handle Password Update ---
        document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('btnUpdatePassword');
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';
            errorDiv.style.display = 'none';

            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Error: " + error.message;
                btn.disabled = false;
                btn.innerHTML = 'Save New Password';
            } else {
                successDiv.style.display = 'block';
                successDiv.innerText = 'Password updated successfully! You can now log in.';
                document.getElementById('updatePasswordForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('formTitle').innerText = 'WTOIS Login';
                document.getElementById('password').value = ''; // Clear old inputs
            }
        });

        // --- 3. Password Visibility Toggle ---
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        });

        // --- 4. Forgot Password Handler ---
        document.getElementById('forgotPassword').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!email) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Please enter your email address in the field above first.";
                return;
            }

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.href // Redirects back to this exact page
            });

            if (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Error: " + error.message;
            } else {
                successDiv.style.display = 'block';
                successDiv.innerText = "Password reset instructions sent! Please check your email inbox.";
            }
        });

        // --- 5. Standard Login Handler ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';
            btn.disabled = true;
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = error.message;
                btn.innerHTML = originalText;
                btn.disabled = false;
            } else {
                try {
                    const { data: profile, error: profileError } = await supabase
                        .from('profiles')
                        .select('account_type')
                        .eq('id', data.user.id)
                        .single();
                    
                    if (profileError) throw profileError;

                    if (profile && profile.account_type === 'ADMIN') {
                        window.location.href = 'admin/employees.html';
                    } else if (profile && profile.account_type === 'EMPLOYEE') {
                        window.location.href = 'employee/dashboard.html';
                    } else {
                        window.location.href = 'applicant/dashboard.html';
                    }
                } catch (err) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = "Routing Error: " + err.message;
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
