<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor's Approval | WTOIS CMO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="dashboard.html">← Back to Queue</a>
            <span class="navbar-text text-white">CMO Approval Module</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <!-- Left Column: Details -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 text-success">Final Application Review</h5>
                    </div>
                    <div class="card-body" id="appDetailsContainer">
                        <p class="text-center">Loading details...</p>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Final Decision -->
            <div class="col-md-5">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white py-3">
                        <h5 class="mb-0">Mayor's Decision</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-success small mb-4">
                            All previous departments (TFRB, CTMO, CTO) have cleared this application. It is now ready for final approval.
                        </div>
                        
                        <div class="d-grid gap-3">
                            <button type="button" id="btnApprove" class="btn btn-success btn-lg fw-bold" onclick="submitDecision('APPROVED')">
                                Approve & Grant MTOP Franchise
                            </button>
                            <button type="button" id="btnReject" class="btn btn-outline-danger" onclick="submitDecision('REJECTED')">
                                Reject Application
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentAppId = new URLSearchParams(window.location.search).get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuthAndRoute();
            if(!auth) return;
            
            if (!currentAppId) {
                document.getElementById('appDetailsContainer').innerHTML = '<div class="alert alert-danger">No application ID provided.</div>';
                return;
            }
            loadApprovalDetails();
        });

        async function loadApprovalDetails() {
            // 1. Get Application & Vehicle (without trying to join profiles)
            const { data: appData, error: appError } = await supabase
                .from('applications')
                .select(`
                    application_number, current_status, transaction_type, remarks, submitted_at, applicant_id,
                    vehicles ( plate_number, make, model, engine_number, chassis_number )
                `)
                .eq('id', currentAppId)
                .single();

            if (appError) {
                document.getElementById('appDetailsContainer').innerHTML = `<div class="alert alert-danger">App Error: ${appError.message}</div>`;
                return;
            }
            
            // 2. Safely get the Profile separately
            const { data: profileData } = await supabase
                .from('profiles')
                .select('first_name, last_name, address')
                .eq('id', appData.applicant_id)
                .single();

            if (appData.current_status !== 'FOR_APPROVAL') {
                document.getElementById('appDetailsContainer').innerHTML = `<div class="alert alert-warning">This application is currently in stage: ${appData.current_status}. It is not ready for final approval.</div>`;
                document.getElementById('btnApprove').disabled = true;
                document.getElementById('btnReject').disabled = true;
                return;
            }

            const firstName = profileData ? profileData.first_name : 'Unknown';
            const lastName = profileData ? profileData.last_name : '';
            const address = profileData ? profileData.address : 'N/A';

            document.getElementById('appDetailsContainer').innerHTML = `
                <h6 class="fw-bold text-secondary border-bottom pb-2">Applicant Information</h6>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Name</div><div class="col-sm-8 fw-bold">${firstName} ${lastName}</div></div>
                <div class="row mb-3"><div class="col-sm-4 text-muted">Address</div><div class="col-sm-8">${address}</div></div>
                
                <h6 class="fw-bold text-secondary border-bottom pb-2 mt-4">Vehicle Information</h6>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Plate Number</div><div class="col-sm-8 fw-bold fs-5 text-success">${appData.vehicles?.plate_number || 'N/A'}</div></div>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Make / Model</div><div class="col-sm-8">${appData.vehicles?.make || ''} ${appData.vehicles?.model || ''}</div></div>
                <div class="row mb-3"><div class="col-sm-4 text-muted">Engine/Chassis</div><div class="col-sm-8 text-break">${appData.vehicles?.engine_number || ''} / ${appData.vehicles?.chassis_number || ''}</div></div>

                <h6 class="fw-bold text-secondary border-bottom pb-2 mt-4">LGU Processing Notes</h6>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Transaction</div><div class="col-sm-8"><span class="badge bg-secondary">${appData.transaction_type}</span></div></div>
                <div class="row mb-2"><div class="col-sm-4 text-muted">Started</div><div class="col-sm-8">${formatDate(appData.submitted_at)}</div></div>
                <div class="row mb-2">
                    <div class="col-sm-4 text-muted">LGU Remarks</div>
                    <div class="col-sm-8"><div class="bg-light p-2 rounded small text-muted font-monospace">${appData.remarks || 'No remarks recorded.'}</div></div>
                </div>
            `;
        }

        async function submitDecision(decision) {
            const isApproving = decision === 'APPROVED';
            if(!confirm(isApproving ? "Are you sure you want to officially APPROVE this franchise?" : "Are you sure you want to REJECT this franchise?")) return;

            const { error } = await supabase.from('applications')
                .update({ current_status: decision })
                .eq('id', currentAppId);

            if (error) {
                // If you get an enum error here, we'll need to run an ALTER TYPE command again for 'APPROVED'
                alert("Database Error: " + error.message);
            } else {
                alert(`Application has been officially ${decision}!`);
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
